<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forever Begins Again</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Cinzel',serif;
    letter-spacing:1px;
}

body{
    background:black;
    color:white;
    overflow:hidden;
    transition:background 2s ease;
}

/* ---------- INTRO ---------- */
#startScreen{
    position:fixed;
    inset:0;
    background:black;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:20;
    cursor:pointer;
    transition:opacity 1.5s ease;
}

#title{
    font-size:3rem;
    text-transform:uppercase;
    opacity:0;
    transform:scale(0.8);
    transition:all 2s ease;
}

#tapText{
    margin-top:20px;
    opacity:0.7;
}

/* ---------- STARFIELD ---------- */
canvas{
    position:fixed;
    top:0;
    left:0;
    z-index:-1;
}

/* ---------- MAIN ---------- */
#mainContent{
    display:none;
    height:100vh;
    overflow-y:auto;
}

.section{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
    text-align:center;
    opacity:0;
    transform:translateY(40px);
    transition:1s ease;
}

.section.active{
    opacity:1;
    transform:translateY(0);
}

.unlockBtn{
    margin-top:20px;
    padding:10px 20px;
    border:none;
    border-radius:20px;
    background:#c300ff;
    color:white;
    cursor:pointer;
}

/* ---------- SLIDESHOW ---------- */
.slideshow{
    position:relative;
    width:90%;
    max-width:650px;
    height:380px;
    overflow:hidden;
    border-radius:15px;
    margin-top:20px;
    box-shadow:0 0 40px rgba(195,0,255,0.3);
}

.slideshow::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom,rgba(0,0,0,0.3),rgba(0,0,0,0.6));
}

.slideshow img{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
    transform:scale(1);
    transition:opacity 1.2s ease, transform 8s ease;
}

.slideshow img.active{
    opacity:1;
    transform:scale(1.08);
}

/* ---------- FINAL SCENE ---------- */
#finalScene{
    position:fixed;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    opacity:0;
    pointer-events:none;
    z-index:50;
    overflow:hidden;
}

#galaxyCanvas{
    position:absolute;
    inset:0;
    z-index:-1;
}

#finalText{
    text-align:center;
    opacity:0;
    transform:scale(0.8);
    transition:all 3s ease;
    animation:glowPulse 3s infinite;
}

#finalText h1{
    font-size:3rem;
    margin-bottom:20px;
}

#finalText h2{
    font-size:2rem;
    opacity:0.8;
}

@keyframes glowPulse{
    0%{text-shadow:0 0 10px #c300ff;}
    50%{text-shadow:0 0 40px #ff00ff;}
    100%{text-shadow:0 0 10px #c300ff;}
}

@keyframes zoomSlow{
    from{transform:scale(1);}
    to{transform:scale(1.08);}
}

.zooming{
    animation:zoomSlow 10s ease forwards;
}

.heart{
    position:absolute;
    font-size:20px;
    animation:floatUp 6s linear infinite;
}

@keyframes floatUp{
    0%{transform:translateY(100vh);opacity:0;}
    20%{opacity:1;}
    100%{transform:translateY(-10vh);opacity:0;}
}
</style>
</head>
<body>

<div id="startScreen">
    <h1 id="title">Forever Begins Again</h1>
    <p id="tapText">Tap to Begin</p>
</div>

<canvas id="stars"></canvas>

<div id="mainContent">

    <!-- CHAPTER I -->
    <div class="section active" id="chapter1">
        <h1>Happy 4th Anniversary 💜</h1>
        <p>This is Chapter IV of us.</p>
        <button class="unlockBtn" onclick="unlockSlideshow()">Begin Our Memories</button>
    </div>

    <!-- CHAPTER II -->
    <div class="section" id="chapter2">
        <h2>Our Memories 📸</h2>

        <div class="slideshow" id="slideshow">
            <img src="photo1.jpg" class="active">
            <img src="photo2.jpg">
            <img src="photo3.jpg">
            <img src="photo4.jpg">
            <img src="photo5.jpg">
            <img src="photo6.jpg">
            <img src="photo7.jpg">
            <img src="photo8.jpg">
            <img src="photo9.jpg">
            <img src="photo10.jpg">
        </div>

        <p id="slideProgress"></p>
    </div>

</div>

<div id="finalScene">
    <canvas id="galaxyCanvas"></canvas>
    <div id="finalText">
        <h1>Four years down…</h1>
        <h2>Forever to go.</h2>
    </div>
</div>

<audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<script>

/* ---------- SAFE DOM ---------- */
const startScreen = document.getElementById("startScreen");
const title = document.getElementById("title");
const mainContent = document.getElementById("mainContent");
const bgMusic = document.getElementById("bgMusic");
const chapter2 = document.getElementById("chapter2");
const slideProgress = document.getElementById("slideProgress");

/* ---------- INTRO ---------- */
setTimeout(()=>{
    title.style.opacity="1";
    title.style.transform="scale(1)";
},500);

startScreen.addEventListener("click",()=>{
    startScreen.style.opacity="0";
    setTimeout(()=>{
        startScreen.style.display="none";
        mainContent.style.display="block";
        document.body.style.overflow="auto";
    },1500);
    bgMusic.play();
});

/* ---------- UNLOCK SLIDESHOW ---------- */
function unlockSlideshow(){
    chapter2.classList.add("active");
    window.scrollTo({top:window.innerHeight,behavior:"smooth"});
}

/* ---------- SLIDESHOW FLOW ---------- */
let slideIndex=0;
const slides=document.querySelectorAll(".slideshow img");

function showSlide(i){
    slides.forEach(s=>s.classList.remove("active"));
    slides[i].classList.add("active");
    slideProgress.innerText="Memory "+(i+1)+" of "+slides.length;
}

function nextSlide(){
    slideIndex++;
    if(slideIndex<slides.length){
        showSlide(slideIndex);
    }else{
        triggerFinal();
    }
}

setInterval(nextSlide,5000);

/* ---------- FINAL FLOW ---------- */
function triggerFinal(){
    document.getElementById("finalScene").style.opacity="1";
    document.getElementById("finalText").style.opacity="1";
    document.getElementById("finalText").classList.add("zooming");
    spawnHearts();
}

/* ---------- HEARTS ---------- */
function spawnHearts(){
    setInterval(()=>{
        const heart=document.createElement("div");
        heart.className="heart";
        heart.innerHTML="💜";
        heart.style.left=Math.random()*100+"vw";
        heart.style.fontSize=(Math.random()*20+20)+"px";
        document.getElementById("finalScene").appendChild(heart);
        setTimeout(()=>heart.remove(),6000);
    },600);
}

</script>
</body>
</html>
