<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Four-ever and Always 💗</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cinzel',serif;}

body{
background:linear-gradient(to bottom,#ffb6d9,#1a0014);
color:#ff1493;
overflow:hidden;
}

/* INTRO */
#startScreen{
position:fixed;
inset:0;
background:#ffb6d9;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
z-index:10;
cursor:pointer;
transition:opacity 1.5s ease;
}

#title{
font-size:2.8rem;
color:#d00385;
opacity:0;
transform:scale(0.8);
transition:2s ease;
letter-spacing:3px;
}

/* CANVAS LAYERS */
canvas{position:fixed;inset:0;}
#stars{z-index:-3;}
#galaxy{z-index:-2;}
#fireworks{z-index:-1;pointer-events:none;}

/* LOVE LEVEL */
#loveMeter{
position:fixed;
top:20px;
right:20px;
font-size:22px;
font-weight:bold;
color:white;
text-shadow:0 0 20px #ff69b4;
z-index:5;
}

/* MAIN */
#mainContent{
display:none;
height:100vh;
overflow-y:auto;
}

.section{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
padding:40px;
text-align:center;
}

button{
margin-top:20px;
padding:14px 28px;
border:none;
border-radius:30px;
background:#ff69b4;
color:white;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 30px rgba(255,105,180,0.6);
}

/* SLIDESHOW */
#slideshowSection{display:none;}

.slideshow{
position:relative;
width:90%;
max-width:700px;
height:450px;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
border-radius:25px;
background:#2a001f;
box-shadow:0 0 40px rgba(255,105,180,0.5);
}

.slideshow img{
position:absolute;
max-width:100%;
max-height:100%;
object-fit:contain;
opacity:0;
transition:opacity 1s ease;
}

.slideshow img.active{opacity:1;}

.zoomSlow{animation:zoomInImg 6s ease forwards;}
@keyframes zoomInImg{
from{transform:scale(1);}
to{transform:scale(1.12);}
}

/* MODAL */
#loveModal{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,0.6);
opacity:0;
pointer-events:none;
transition:opacity 0.6s ease;
z-index:60;
}

#loveModal.show{
opacity:1;
pointer-events:auto;
}

.modalGlow{
padding:40px;
border-radius:30px;
text-align:center;
color:white;
background:linear-gradient(135deg,#ff69b4,#ffb6d9,#ff1493);
background-size:300% 300%;
animation:gradientMove 6s ease infinite, popIn 0.5s ease;
box-shadow:0 0 40px #ff69b4, 0 0 80px #ffb6d9;
}

.modalGlow h2{font-size:2rem;margin-bottom:15px;}
.modalGlow p{font-size:1.1rem;margin:8px 0;}
.modalSub{opacity:0.9;font-weight:bold;}

@keyframes popIn{
from{transform:scale(0.6);opacity:0;}
to{transform:scale(1);opacity:1;}
}

@keyframes gradientMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

/* HEART */
.heart{
position:fixed;
font-size:24px;
animation:floatUp 6s linear forwards;
}
@keyframes floatUp{
0%{transform:translateY(100vh);opacity:0;}
20%{opacity:1;}
100%{transform:translateY(-10vh);opacity:0;}
}
</style>
</head>
<body>

<div id="startScreen">
<h1 id="title">Four-ever and Always 💗</h1>
<p>Tap to Begin</p>
</div>

<canvas id="stars"></canvas>
<canvas id="galaxy"></canvas>
<canvas id="fireworks"></canvas>

<div id="loveMeter">Love Level: 0%</div>

<div id="mainContent">
<div class="section">
<h1>Happy 4th Anniversary 💕</h1>
<button onclick="increaseLove()">Click to unlock Love Archives</button>
</div>

<div class="section" id="slideshowSection">
<h2>Our Memories 📸</h2>
<div class="slideshow" id="slideshow">
<img src="photo1.jpg" class="active">
<img src="photo2.jpg">
<img src="photo3.jpg">
<img src="photo4.jpg">
<img src="photo5.jpg">
<img src="photo6.jpg">
<img src="photo7.jpg">
<img src="photo8.jpg">
<img src="photo9.jpg">
<img src="photo10.jpg">
</div>
</div>
</div>

<div id="loveModal">
<div class="modalGlow">
<h2>Four years down…</h2>
<p id="modalQuote"></p>
<p class="modalSub">Forever to go 💗</p>
</div>
</div>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mp3">
</audio>

<script>

/* INTRO */
const startScreen=document.getElementById("startScreen");
const title=document.getElementById("title");
const mainContent=document.getElementById("mainContent");
const bgMusic=document.getElementById("bgMusic");

setTimeout(()=>{title.style.opacity="1";title.style.transform="scale(1)";},500);

startScreen.onclick=()=>{
startScreen.style.opacity="0";
setTimeout(()=>{
startScreen.style.display="none";
mainContent.style.display="block";
document.body.style.overflow="auto";
},1500);
};

/* AUTO SCROLL */
function autoScroll(){
setTimeout(()=>{
document.getElementById("slideshowSection")
.scrollIntoView({behavior:"smooth"});
},500);
}

/* LOVE SYSTEM */
let lovePoints=0;

function increaseLove(){
lovePoints+=20;
if(lovePoints>100)lovePoints=100;
document.getElementById("loveMeter").innerText="Love Level: "+lovePoints+"%";

if(lovePoints===100){
document.getElementById("slideshowSection").style.display="flex";
autoScroll();
startSlideshow();
startMusic();
startFireworks();
showModal();
}
}

/* MUSIC */
function startMusic(){
bgMusic.volume=0;
bgMusic.play().catch(()=>{});
let vol=0;
const fade=setInterval(()=>{
vol+=0.02;
if(vol>=1){vol=1;clearInterval(fade);}
bgMusic.volume=vol;
},100);
}

/* SLIDESHOW */
function startSlideshow(){
const slides=document.querySelectorAll("#slideshow img");
let index=0;
setInterval(()=>{
slides[index].classList.remove("active","zoomSlow");
index=(index+1)%slides.length;
slides[index].classList.add("active");
if(Math.random()>0.5)slides[index].classList.add("zoomSlow");
},5000);
}

/* MODAL */
function showModal(){
const quotes = [
"Love is choosing each other every day.",
"Loyalty is rare — and we have it.",
"You are my forever decision.",
"In every lifetime, I choose you.",
"Real love is not perfect — it is consistent.",
"We didn’t just fall in love. We stayed in love.",
"Some people find love. We built ours.",
"Four years strong. A lifetime to go.",
"Forever isn’t a dream — it’s a commitment.",
"We grew together instead of growing apart.",
"Love is not about time. It’s about intention.",
"Through chaos, we remained calm for each other.",
"You are my peace in a loud world.",
"Not temporary. Not seasonal. Not convenient. Ours is intentional.",
"Still us. Still choosing. Still growing.",
"We are proof that love matures.",
"Not just lovers — partners in everything.",
"You are my safest place.",
"Our love survived everything meant to break it.",
"We didn’t just last. We evolved.",
"Four years later, and I’d still start again with you.",
"Some stories end. Ours keeps beginning.",
"We stayed when it would’ve been easier to leave.",
"You are my constant in every version of me.",
"Four-ever and Always."
];

document.getElementById("modalQuote").innerText=
quotes[Math.floor(Math.random()*quotes.length)];

setTimeout(()=>{
document.getElementById("loveModal").classList.add("show");
},8000);

setTimeout(()=>{
document.getElementById("loveModal").classList.remove("show");
},14000);
}

/* FIREWORKS */
const fireCanvas=document.getElementById("fireworks");
const fctx=fireCanvas.getContext("2d");
fireCanvas.width=innerWidth;
fireCanvas.height=innerHeight;

let rockets=[],particles=[],active=false;

function startFireworks(){
active=true;
animateFireworks();
let rocketInt=setInterval(()=>launchRocket(),600);
setTimeout(()=>clearInterval(rocketInt),25000);
}

function launchRocket(){
rockets.push({
x:Math.random()*innerWidth,
y:innerHeight,
vx:(Math.random()-0.5)*1.5,
vy:-10
});
}

function explode(x,y){
if(navigator.vibrate)navigator.vibrate(15);
for(let i=0;i<80;i++){
particles.push({x,y,vx:(Math.random()-0.5)*6,
vy:(Math.random()-0.5)*6,alpha:1});
}
for(let i=0;i<5;i++){
let heart=document.createElement("div");
heart.className="heart";
heart.innerHTML="💗";
heart.style.left=x+"px";
heart.style.top=y+"px";
document.body.appendChild(heart);
setTimeout(()=>heart.remove(),6000);
}
}

function animateFireworks(){
if(!active)return;
fctx.clearRect(0,0,innerWidth,innerHeight);

for(let i=rockets.length-1;i>=0;i--){
let r=rockets[i];
r.x+=r.vx;
r.y+=r.vy;
r.vy+=0.08;
fctx.fillStyle="#ff69b4";
fctx.beginPath();
fctx.arc(r.x,r.y,3,0,Math.PI*2);
fctx.fill();
if(r.vy>=0){
explode(r.x,r.y);
rockets.splice(i,1);
}
}

for(let i=particles.length-1;i>=0;i--){
let p=particles[i];
p.x+=p.vx;
p.y+=p.vy;
p.vy+=0.05;
p.alpha-=0.02;
fctx.globalAlpha=p.alpha;
fctx.fillStyle="#ffc0db";
fctx.beginPath();
fctx.arc(p.x,p.y,3,0,Math.PI*2);
fctx.fill();
if(p.alpha<=0)particles.splice(i,1);
}

fctx.globalAlpha=1;
requestAnimationFrame(animateFireworks);
}

/* GALAXY */
const galaxyCanvas=document.getElementById("galaxy");
const gctx=galaxyCanvas.getContext("2d");
galaxyCanvas.width=innerWidth;
galaxyCanvas.height=innerHeight;

let galaxyStars=[];
for(let i=0;i<300;i++){
galaxyStars.push({
x:Math.random()*innerWidth,
y:Math.random()*innerHeight,
size:Math.random()*2,
speed:Math.random()*0.2
});
}

function animateGalaxy(){
let driftX=Math.sin(Date.now()*0.0002)*25;
let driftY=Math.cos(Date.now()*0.0002)*25;
gctx.fillStyle="rgba(0,0,0,0.35)";
gctx.fillRect(0,0,innerWidth,innerHeight);
gctx.fillStyle="#ffb6d9";
galaxyStars.forEach(star=>{
star.y+=star.speed;
if(star.y>innerHeight)star.y=0;
gctx.beginPath();
gctx.arc(star.x+driftX,star.y+driftY,star.size,0,Math.PI*2);
gctx.fill();
});
requestAnimationFrame(animateGalaxy);
}
animateGalaxy();

</script>
</body>
</html>
